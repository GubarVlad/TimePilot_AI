services:
  - type: web
    name: timepilot-ai
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m backend.app
    healthCheckPath: /api/health
    envVars:
      - key: PUBLIC_DEPLOY
        value: "true"
      - key: APP_PASSWORD
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3.5-bolt-e4b
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1/chat/completions
      - key: NVIDIA_STT_SERVER
        value: grpc.nvcf.nvidia.com:443
      - key: NVIDIA_STT_FUNCTION_ID
        value: 71203149-d3b7-4460-8231-1be2543a1fca
      - key: DATA_DIR
        value: ./data
